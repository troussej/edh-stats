<app-options></app-options>
<div class="grid grid-cols-1 gap-4 m-4 ">

    <div class="grid lg:grid-cols-3 gap-4">


        <app-global-stats></app-global-stats>
        <p-fieldset legend="Brackets" class="" [toggleable]="true">

            <app-per-bracket></app-per-bracket>
        </p-fieldset>
        <p-fieldset legend="Par lieu" class="" [toggleable]="true">
            <app-lieu></app-lieu>

        </p-fieldset>
    </div>



    <div class="grid xl:grid-cols-2 gap-4">
        <div>
            <p-fieldset legend=" Par winrate (plus de 3 parties)" [toggleable]="true">
                <app-table [stats]="perWinrate()" sortField="winrate" [sortOrder]="-1"></app-table>
            </p-fieldset>
        </div>
        <div>

            <p-fieldset legend="Nombre de parties" [toggleable]="true">
                <app-table [stats]="perGames()" sortField="games" [sortOrder]="-1"
                    legend="Nombre de parties"></app-table>
            </p-fieldset>
        </div>
    </div>
</div>
