<div class="m-4">


    <p-card class="mb-2 ">
        <input pInputText [(ngModel)]="filter" type="text" name="filter" placeholder="Commander" />
        <p-selectbutton [options]="brackets" [(ngModel)]="bracketFilter" [multiple]="true" class="ml-2"
            optionValue="value" optionLabel="name" />
    </p-card>

    <div class="grid sm:grid-cols-2 md:grid-cols-4  xg:grid-cols-6 gap-4 ">



        @for (cmr of commanders(); track $index) {
        <app-commander-card [cmr]="cmr"></app-commander-card>
        }


    </div>
</div>
