<div class="m-2">


    <p-select [options]="commanders()" (onChange)="gotTo($event)" [showClear]="true" placeholder="Commander"
        filter="true"></p-select>

    <div class="grid grid-cols-1 lg:grid-cols-2 mt-2 gap-2">

        <p-card class="">
            <app-commander-card [cmr]="commander()"></app-commander-card>
        </p-card>
        <div>
            <p-card>
                <app-per-location [filters]="filterPerLocation()"></app-per-location>
            </p-card>
        </div>
    </div>
</div>
