<p-table [value]="stats" size="small" showGridlines [sortField]="sortField" [sortOrder]="sortOrder" class="mt-4"
    scrollable="true">
    <ng-template #header>
        <tr>
            @if(commanderCol){
            <th pSortableColumn="title">
                <span>Commandeur</span>

                <p-sort-icon field="title" />
            </th>
            }
            @else(){
            <th pSortableColumn="title"><span>{{title}}</span>

                <p-sort-icon field="title" />
            </th>
            }
            <th pSortableColumn="games"><span class="">Parties</span>

            </th>
            <th pSortableColumn="wins" class="hidden md:table-cell"><span class="">Gagnées</span>
                <!-- <span class="invisible max-sm:visible">G</span> -->
                <p-sort-icon field="wins" />
            </th>
            <th pSortableColumn="losses" class="hidden md:table-cell"><span class="">Perdues</span>
                <!-- <span class="invisible max-sm:visible">P</span> -->
                <p-sort-icon field="losses" />
            </th>
            <th pSortableColumn="winrate"><span class="invisible md:visible">Winrate</span>
                <span class="invisible max-md:visible">W%</span>
                <p-sort-icon field="winrate" />
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-stat>
        <tr>
            @if(commanderCol){
            <td class="p-0">
                <div class="m-1">

                    <app-commander-title [commander]="stat.commander" avatarSize="small"></app-commander-title>
                </div>
            </td>
            }
            @else(){
            <td>{{ stat.title }}</td>
            }
            <td>{{ stat.games }}</td>
            <td class="hidden md:table-cell">{{ stat.wins }}</td>
            <td class="hidden md:table-cell">{{ stat.losses }}</td>
            <td>{{ stat.winrate |percent}}</td>
        </tr>
    </ng-template>
</p-table>
