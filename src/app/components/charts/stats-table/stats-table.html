<p-table [value]="stats" size="small" showGridlines [sortField]="sortField" [sortOrder]="sortOrder" class="mt-4 w-full"
    scrollable="true">
    <ng-template #header>
        <tr>
            @if(commanderCol){
            <th pSortableColumn="title">Commandeur <p-sort-icon field="title" /> </th>
            }
            @else(){
            <th pSortableColumn="title">{{title}} <p-sort-icon field="title" />
            </th>
            }
            <th pSortableColumn="games">Parties <p-sort-icon field="games" /></th>
            <th pSortableColumn="wins">Gagnées <p-sort-icon field="wins" /></th>
            <th pSortableColumn="losses">Perdues <p-sort-icon field="losses" /></th>
            <th pSortableColumn="winrate">Winrate <p-sort-icon field="winrate" /></th>
        </tr>
    </ng-template>
    <ng-template #body let-stat>
        <tr>
            @if(commanderCol){
            <td class="p-0">
                <div class="m-1">

                    <app-commander-title [commander]="stat.commander" avatarSize="small"></app-commander-title>
                </div>
            </td>
            }
            @else(){
            <td>{{ stat.title }}</td>
            }
            <td>{{ stat.games }}</td>
            <td>{{ stat.wins }}</td>
            <td>{{ stat.losses }}</td>
            <td>{{ stat.winrate |percent}}</td>
        </tr>
    </ng-template>
</p-table>
