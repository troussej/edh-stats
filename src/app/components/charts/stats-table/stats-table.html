<p-table [value]="stats" size="small" [sortField]="sortField" [sortOrder]="sortOrder" class="mt-4" scrollable="true">
    <ng-template #header>
        <tr>
            @if(commanderCol){
            <th pSortableColumn="title" class=" text-nowrap">
                <span>Commandeur</span>
                <p-sort-icon field="title" class="ml-1" />
            </th>
            }
            @else(){
            <th pSortableColumn="title" class="text-nowrap"><span>{{title}}</span>

                <p-sort-icon field="title" class="ml-1" />
            </th>
            }
            <th pSortableColumn="games" class="text-nowrap"><span class="">Parties</span>
                <p-sort-icon field="games" class="ml-1" />

            </th>
            <th pSortableColumn="wins" class="hidden md:table-cell  text-nowrap"><span> Gagnées
                </span><p-sort-icon field="wins" class="ml-1" />
            </th>
            <th pSortableColumn="losses" class="hidden md:table-cell  text-nowrap">
                <span>Perdues</span><p-sort-icon field="losses" class="ml-1" />
            </th>
            <th pSortableColumn="winrate" class="text-nowrap">
                <span class="invisible md:visible">Winrate</span>
                <span class="invisible max-md:visible">W%</span>
                <p-sort-icon field="winrate" class="ml-1" />
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-stat>
        <tr>
            @if(commanderCol){
            <td class="p-0">
                <div class="m-1">

                    <app-commander-title [commander]="stat.commander" avatarSize="small"></app-commander-title>
                </div>
            </td>
            }
            @else(){
            <td>{{ stat.title }}</td>
            }
            <td>{{ stat.games }}
                @if(stat.dnfs > 0){
                <span class="text-xs">({{ stat.dnfs }} DNF)</span>
                }

            </td>
            <td class="hidden md:table-cell">{{ stat.wins }}</td>
            <td class="hidden md:table-cell">{{ stat.losses }}</td>
            <td>{{ stat.winrate |percent}}</td>
        </tr>
    </ng-template>
</p-table>
