<p-table [value]="stats" size="small" [sortField]="sortField" [sortOrder]="sortOrder" class="mt-2" scrollable="true">
    <ng-template #header>
        <tr>
            @if(commanderCol){
            <th pSortableColumn="title" class=" text-nowrap">
                <span>Commandeur</span>
                <p-sort-icon field="title" class="ml-1" />
            </th>
            }
            @else(){
            <th pSortableColumn="title" class="text-nowrap"><span>{{title}}</span>

                <p-sort-icon field="title" class="ml-1" />
            </th>
            }
            <th class="text-sm">
                <div pSortableColumn="winrate">
                    <span>Winrate</span>
                    <p-sort-icon field="winrate" class="ml-1" />
                </div>
                <div pSortableColumn="games">
                    <span>Games</span>
                    <p-sort-icon field="games" class="ml-1" />
                </div>
            </th>



        </tr>
    </ng-template>
    <ng-template #body let-stat>
        <tr>
            @if(commanderCol){
            <td class="">
                <div class="m-1 mt-3">

                    <app-commander-title [commander]="stat.commander" avatarSize="small"></app-commander-title>
                </div>
            </td>
            }
            @else(){
            <td>{{ stat.title }}</td>
            }
            <td>

                <app-winrate-bar [stats]="stat" [max]="maxGames()"></app-winrate-bar>
            </td>
        </tr>
    </ng-template>
</p-table>
