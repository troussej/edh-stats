<p-table [value]="stats" size="small" [sortField]="sortField" [sortOrder]="sortOrder" class="mt-2" scrollable="true">
    <ng-template #header>
        <tr class="grid " [class]="`grid-cols-${sizeTotal()}`">
            <th pSortableColumn="title" class=" text-nowrap col-span-{{sizeLeft}}">
                @if(commanderCol){
                <span>Commandeur</span>
                <p-sort-icon field="title" class="ml-1" />
                }
                @else(){
                <span>{{title}}</span>

                <p-sort-icon field="title" class="ml-1" />
                }
            </th>
            <th class="text-sm col-span-{{sizeRight}} flex flex-row gap-2">
                <div pSortableColumn="winrate" sortOrder="-1">
                    <span>Winrate</span>
                    <p-sort-icon field="winrate" class="ml-1" />
                </div>
                <div pSortableColumn="games" sortOrder="-1">
                    <span>Games</span>
                    <p-sort-icon field="games" class="ml-1" />
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-stat>
        <tr class="grid " [class]="`grid-cols-${sizeTotal()}`">
            <td class="col-span-{{sizeLeft}}">
                @if(commanderCol){
                <div class="m-1 mt-3">

                    <app-commander-title [commander]="stat.commander" avatarSize="small"></app-commander-title>
                </div>
                }
                @else(){
                {{ stat.title }}

                }
            </td>
            <td class="col-span-{{sizeRight}} flex items-center">

                <app-winrate-bar [stats]="stat" [max]="maxGames()" class="w-full"></app-winrate-bar>
            </td>
        </tr>
    </ng-template>
</p-table>
