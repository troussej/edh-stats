<div class="w-full text-xs">
    <div class="w-full flex flex-row rounded-xl overflow-hidden" [style.width.%]="barWidth()">
        @for (value of values(); track value.bracket) {
            @if (value.count > 0) {
                <div class="px-1 text-gray-800 font-semibold overflow-hidden truncate"
                    [style.width.%]="value.fraction * 100" [style.background-color]="value.color"
                    role="img" [attr.aria-label]="'Bracket ' + value.bracket + ': ' + value.count + ' (' + (value.fraction | percent:'1.0-1') + ')'">
                    <span aria-hidden="true">{{ value.count }} B{{ value.bracket }}</span>
                </div>
            }
        }
    </div>
</div>
