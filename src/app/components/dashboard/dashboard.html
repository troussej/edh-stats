<div class="grid lg:grid-cols-2 gap-4 m-4">
    <div class="col-span-1">

        <app-global-stats [(currentYear)]="currentYear"></app-global-stats>
    </div>
    <app-lieu [currentYear]="currentYear"></app-lieu>

    @if(perWinrate|async){
    <app-table [stats]="(perWinrate|async)??[]" sortField="winrate" [sortOrder]="-1"
        legend="Par winrate (plus de 3 parties)"></app-table>
    }
    @if(perGames|async){
    <app-table [stats]="(perGames|async)??[]" sortField="games" [sortOrder]="-1" legend="Nombre de parties"></app-table>
    }
</div>
