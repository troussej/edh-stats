<div class="grid grid-cols-2 gap-4 m-4">
    <div class="col-span-1">

        <app-global-stats></app-global-stats>
    </div>
    <app-lieu></app-lieu>

    @if(perWinrate|async){
    <app-table [stats]="(perWinrate|async)??[]" sortField="winrate" [sortOrder]="-1"
        title="Par winrate (plus de 3 parties)"></app-table>
    }
    @if(perGames|async){
    <app-table [stats]="(perGames|async)??[]" sortField="games" [sortOrder]="-1" title="Nombre de parties"></app-table>
    }
</div>
