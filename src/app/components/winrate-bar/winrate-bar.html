<div class="w-full flex flex-row gap-1 ">
    <div class="bg-gray-800 rounded-xl text-xs px-1 min-w-8 flex justify-center">
        {{games()}}G
    </div>
    <!-- @if(this.stats().dnfs > 0){
    <div class="rounded-xl text-xs px-1  bg-gray-300 text-gray-800">
        {{this.stats().dnfs}}D
    </div>
    } -->

    <div class="w-full flex flex-row rounded-xl text-xs" [style.width.%]="gamesPercentage() ">
        @for(value of values();track value){
        @if(value.value >0){
        <div [class]="value.class" class="px-1 text-gray-800 font-semibold overflow-hidden truncate "
            [style.width.%]="value.value" pTooltip="{{value.rate}}">
            {{value.count}}{{value.name}}
            <!-- @if(value.rate !==''){
            ({{value.rate}})
            } -->
        </div>
        }
        }
    </div>

</div>
